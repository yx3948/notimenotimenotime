<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NO TIME</title>
  <style>

    @font-face {
      font-family: 'Kalice';
      src: url('Kalice-Regular.ttf');
    }

    @font-face {
      font-family: 'Kalice';
      src: url('Kalice-Italic.ttf');
      font-style: italic;
    }

    body {
      background-color: black;
      color: white;
      font-family: 'Kalice', serif;
      overflow-x: hidden;
      cursor: crosshair;
    }

    #bottombar{
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      z-index:9999;
      background-color: black;
    }

      #message {
     position: fixed;
     /* width:90vw; */
      bottom: 1vh;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      text-align: center;
      color: rgb(255, 0, 0);
      font-size: 60px;
      z-index: 99999;
    }

      #countdown {
     visibility: hidden;
    }
      #countdown {
      position: fixed;
      bottom: -2vh;
      right: 45vw;
      color: rgb(255, 0, 0);
      font-size: 90px;
      z-index: 99999;
}

    .backdrop {
      position: fixed;
      left:0;
      color:rgb(177, 177, 177);
      /* white-space: nowrap; */
      font-size: 90px;
      text-align: justify;
      width: 96vw;
      line-height: 0.9;
      padding-left: 2vw;
      padding-right: 2vw;
      /* opacity: 0.15; */
      /* animation: slide 20s linear infinite; */
    }

    .popup {
      position: fixed;
      cursor:progress;
      overflow: hidden;
      word-break: break-word;
     width: 40vw;
     height: 20vh;
     background: black;
     border: 1px solid white;
     color: white;
     font-size: 20px;
     z-index: 999999;
     padding: 20px;
}
  </style>
</head>
<body>
 <div id = "bottombar"></div>
 <div class="backdrop"></div>
 <div id="countdown">1:00</div>
 <div id="message"><em>The memories you didn't make are the ones that haunt you.</em></div>
<div id="popup">
  <div id="popup-content"></div>
</div>

<script src="script.js"></script>
</body>
</html>
