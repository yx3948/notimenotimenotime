    @font-face {
      font-family: 'Kalice';

    body {
      background-color: black;
      color: white;
      font-family: 'Kalice', serif;
      overflow-x: hidden;
      cursor: crosshair;
    }

    .backdrop {
      position: fixed;
      white-space: nowrap;
      font-size: 14px;
      opacity: 0.15;
      animation: slide 20s linear infinite;
    }

    @keyframes slide {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

  </style>
</head>
