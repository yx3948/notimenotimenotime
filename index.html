<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NO TIME</title>
  <style>

    @font-face {
      font-family: 'Kalice';
      src: url('Kalice-Regular.ttf');
    }

    @font-face {
      font-family: 'Kalice';
      src: url('Kalice-Italic.ttf');
      font-style: italic;
    }

    body {
      background-color: black;
      color: white;
      font-family: 'Kalice', serif;
      overflow-x: hidden;
      cursor: crosshair;
    }

    #bottombar{
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      z-index:9999;
      background-color: black;
    }

    #countdown {
      position: fixed;
      bottom: -2vh;
      right: 45vw;

      color: rgb(255, 0, 0);
      font-size: 90px;
      z-index: 99999;
}

    .backdrop {
      position: fixed;
      color:rgb(177, 177, 177);
      /* white-space: nowrap; */
      font-size: 90px;
      text-align: justify;
      width: 100vw;
      line-height: 0.9;
      /* opacity: 0.15; */
      /* animation: slide 20s linear infinite; */
    }

  </style>
</head>
<body>
 <div id = "bottombar"></div>
<div class="backdrop"></div>
<div id="countdown">5:00</div>

<script src="script.js"></script>
</body>
</html>
